#
# MagIRC 2.x - Anope 2.1 configuration guide
#
# MagIRC reads live network data (users, channels, servers, operators) from
# Anope's JSON-RPC interface. Nothing on the Anope side needs MySQL for that.
# Channel activity statistics are optional and come from Anope's own
# chanstats module, which does require MySQL or MariaDB.
#
# The blocks below are the ones you need to enable or adjust in
# conf/modules.conf (and conf/chanstats.conf for activity statistics).
# Copy what you need; the surrounding comments in Anope's own example
# configs explain every other option.
#

#
# 1. httpd  -- the web server the RPC interface listens on.
#
# Bind it to localhost unless MagIRC runs on another host. If it does, put
# it behind TLS (a reverse proxy, or ssl = yes with an SSL module) and
# firewall the port: anyone who can reach it with the token can read the
# full user list, including IP addresses.
#
module
{
	name = "httpd"

	httpd
	{
		name = "httpd/main"
		ip = "127.0.0.1"
		port = 8080
		timeout = 30
		#ssl = yes
	}
}

#
# 2. jsonrpc -- exposes RPC methods over httpd at http://127.0.0.1:8080/jsonrpc
#
# Always set a token. MagIRC sends it as "Authorization: Bearer <token>",
# base64-encoded as Anope expects (MagIRC does the encoding for you).
# Restrict it to the read-only anope.* data methods; MagIRC never needs the
# anope.message* or anope.*User methods.
#
module
{
	name = "jsonrpc"
	server = "httpd/main"

	token
	{
		# Generate your own, e.g. with: openssl rand -base64 24
		token = "change-me-to-a-long-random-string"

		# Methods this token may call. MagIRC only needs the rpc_data methods;
		# the negated patterns block the rpc_message and rpc_user methods.
		methods = "~anope.message* ~anope.command ~anope.identify ~anope.checkCredentials ~anope.listCommands anope.*"
	}
}

#
# 3. rpc_data -- the anope.listUsers / anope.listChannels / anope.listServers /
#    anope.listOpers methods and their single-object variants.
#
# This replaces the irc2sql module that MagIRC 1.x used (irc2sql was removed
# from Anope in 2.1.16).
#
module { name = "rpc_data" }

#
# 4. OPTIONAL: chanstats -- channel activity statistics (lines, words,
#    smileys, kicks, hourly activity). Enables MagIRC's "activity" pages.
#
# Requirements:
#   * Anope built with the mysql module (./extras, enable mysql).
#   * A MySQL or MariaDB server.
#   * event_scheduler = ON in the database server if you want the daily,
#     weekly and monthly periods. Anope creates three scheduled events that
#     reset those counters; with the scheduler off (the default in MySQL and
#     MariaDB) the events never run and MagIRC falls back to showing
#     all-time statistics only. Enable it with
#         SET GLOBAL event_scheduler = ON;
#     and make it permanent in my.cnf:  [mysqld] event_scheduler = ON
#   * Channels opt in with /msg ChanServ SET CHANSTATS #channel ON and users
#     with /msg NickServ SET CHANSTATS ON. Only identified users who opted
#     in get per-user statistics.
#
# The database user needs CREATE, CREATE ROUTINE and EVENT privileges on the
# database, because chanstats creates its table, two stored procedures and
# the three events itself on startup.
#
module
{
	name = "mysql"

	mysql
	{
		name = "mysql/main"
		database = "anope"
		server = "127.0.0.1"
		username = "anope"
		password = "secret"
		port = 3306
	}
}

# This block normally lives in conf/chanstats.conf; make sure anope.conf
# includes that file:
#
#   include
#   {
#   	type = "file"
#   	name = "chanstats.conf"
#   }
#
module
{
	name = "chanstats"
	engine = "mysql/main"

	# Table prefix. MagIRC needs the same value in its own configuration.
	prefix = "anope_"

	smileyshappy = ":) :-) ;) ;-) :D :-D :P :-P"
	smileyssad = ":( :-( ;( ;-("
	smileysother = ":/ :-/"
}

